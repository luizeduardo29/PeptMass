# PeptMass web. Uma replica so' por instancia: os arquivos de MS abertos ficam
# em memoria.
#
# O nome do projeto (e por isso o do volume com o banco) nao depende do nome
# da pasta: e' sempre "peptmass", salvo PEPTMASS_INSTANCIA. Para rodar uma
# segunda instancia, com banco proprio, em outra porta:
#
#   PEPTMASS_INSTANCIA=peptmass2 PORTA_HOST=8011 docker compose up -d
name: "${PEPTMASS_INSTANCIA:-peptmass}"

services:
  peptmass:
    build: .
    # O ThermoRawFileParser so existe para amd64. Em Mac M1 ou mais novo o
    # Docker Desktop roda esta imagem pelo Rosetta.
    platform: linux/amd64
    image: "peptmass:${TAG:-1.0}"
    restart: unless-stopped
    mem_limit: "${MEM_LIMIT:-2g}"
    ports:
      - "${PORTA_HOST:-8010}:8010"
    environment:
      PEPTMASS_DATA_DIR: /data
      PEPTMASS_MAX_UPLOAD_MB: "${PEPTMASS_MAX_UPLOAD_MB:-4096}"
    volumes:
      # Banco (peptideos salvos, residuos e modificacoes) e envios temporarios.
      - dados:/data

volumes:
  dados:
